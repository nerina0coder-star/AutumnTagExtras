[build-system]

equires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]

packages = ["src/AutumnTagExtras/"]

[tool.hatch.build.targets.sdist]

include = [
    "src/AutumnTagExtras/**/*.py",
    "src/AutumnTagExtras/py.typed",
    "src/AutumnTagExtras/**/*.pyi"
]  

[tool.hatch.build]

metadata-version = "2.2"

[project]

name = "autumn-tag-extras"
version = "1.0.0"
description = "Autumn (Tag Extras) - Build HTML easily right in your backend"
requires-python = "~=3.12"
license = "MIT"
readme = "README.md"
authors = [{name = "Nerina0Coder",email = "github.py.coder@gmail.com"}]
dependencies = [
    "autumn-core~=1.0.2"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment"
] 
